<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="แพลตฟอร์มการท่องเที่ยวเชิงสะสม Limited Travel Card">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15294D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Travel Card">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
  <script>
    // This app no longer uses a service worker. Remove any registered by earlier builds (they can serve a stale,
    // half-updated copy of the app and leave a white screen), then reload once.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        if (!regs.length) return;
        Promise.all(regs.map((r) => r.unregister()))
          .then(() => (window.caches ? caches.keys().then((ks) => Promise.all(ks.map((k) => caches.delete(k)))) : null))
          .then(() => location.reload());
      }).catch(() => {});
    }
  </script>
  <script>
    // Browser-side face descriptor helper used by registration and the check-in kiosk.
    // Returns a JSON string of 128 numbers, or null when no face is found.
    window.travelFace = (function () {
      const MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
      let ready = null;
      function waitForLib() {
        return new Promise((resolve, reject) => {
          const started = Date.now();
          (function check() {
            if (window.faceapi) return resolve();
            if (Date.now() - started > 20000) return reject(new Error('face library failed to load'));
            setTimeout(check, 100);
          })();
        });
      }
      function ensureModels() {
        if (!ready) {
          ready = (async () => {
            await waitForLib();
            await faceapi.tf.setBackend('webgl').catch(() => {});
            await faceapi.tf.ready();
            await Promise.all([
              faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
              faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),
              faceapi.nets.faceRecognitionNet.loadFromUri(MODELS),
            ]);
          })().catch((e) => { ready = null; throw e; });
        }
        return ready;
      }
      // The camera plugin's <video> elements may sit inside shadow roots. Only videos with a live camera track count
      // (a closed camera leaves a dead 2x2 video behind); `label` picks one camera when several are open.
      function findVideo(label) {
        const roots = [document];
        const live = [];
        while (roots.length) {
          const root = roots.pop();
          root.querySelectorAll('*').forEach((el) => {
            if (el.tagName === 'VIDEO' && el.srcObject && el.srcObject.getVideoTracks && el.readyState >= 2 && el.videoWidth >= 64) {
              const track = el.srcObject.getVideoTracks()[0];
              if (track && track.readyState === 'live') live.push({ el, label: track.label });
            }
            if (el.shadowRoot) roots.push(el.shadowRoot);
          });
        }
        if (label) {
          const match = live.find((v) => v.label === label);
          if (match) return match.el;
        }
        return live.length ? live[live.length - 1].el : null;
      }
      function loadImage(dataUrl) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('bad image'));
          img.src = dataUrl;
        });
      }
      let qrCanvas = null;
      return {
        preload: () => ensureModels().then(() => true).catch(() => false),
        // Decodes a QR code from the current frame of the live camera ('' when none is visible).
        readQr: function (label) {
          const video = findVideo(label || null);
          if (!video || !window.jsQR) return '';
          const scale = Math.min(1, 960 / video.videoWidth);
          const w = Math.round(video.videoWidth * scale);
          const h = Math.round(video.videoHeight * scale);
          if (!qrCanvas) qrCanvas = document.createElement('canvas');
          qrCanvas.width = w;
          qrCanvas.height = h;
          const ctx = qrCanvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, w, h);
          const code = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
          return code ? code.data : '';
        },
        // Fast per-frame check on the live camera <video> (no JPEG round trip). Returns a JSON string:
        // {problem} for no / several / tiny faces, else {yaw} (nose position across the jaw: ~0.5 facing the camera)
        // plus {descriptor} when the frame matches `mode` ('frontal' | 'turned') - the heavy recognition net runs only then.
        liveFrame: async function (mode, label) {
          await ensureModels();
          const video = findVideo(label || null);
          if (!video) return JSON.stringify({ problem: 'novideo' });
          const fast = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.6 });
          const faces = await faceapi.detectAllFaces(video, fast).withFaceLandmarks();
          if (faces.length === 0) return JSON.stringify({ problem: 'none' });
          if (faces.length > 1) return JSON.stringify({ problem: 'multiple' });
          if (faces[0].detection.box.width / video.videoWidth < 0.2) return JSON.stringify({ problem: 'small' });
          const pts = faces[0].landmarks.positions;
          const yaw = (pts[30].x - pts[0].x) / (pts[16].x - pts[0].x);
          const off = Math.abs(yaw - 0.5);
          const wanted = (mode === 'frontal' && off <= 0.09) || (mode === 'turned' && off >= 0.12);
          if (!wanted) return JSON.stringify({ yaw });
          const full = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.6 });
          const withId = await faceapi.detectAllFaces(video, full).withFaceLandmarks().withFaceDescriptors();
          if (withId.length !== 1) return JSON.stringify({ yaw });
          return JSON.stringify({ yaw, descriptor: Array.from(withId[0].descriptor) });
        },
      };
    })();

    // Current GPS position as a JSON string, or '' when unavailable or denied.
    window.travelGeo = {
      get: () => new Promise((resolve) => {
        if (!navigator.geolocation) return resolve('');
        navigator.geolocation.getCurrentPosition(
          (p) => resolve(JSON.stringify({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy })),
          () => resolve(''),
          { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 });
      }),
    };
  </script>
  <title>Limited Travel Card</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
