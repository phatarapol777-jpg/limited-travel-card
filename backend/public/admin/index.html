<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limited Travel Card - Admin</title>
<style>
  :root { --navy:#14284b; --gold:#d4af37; --bg:#f4f6fa; --line:#e3e7ef; --red:#c0392b; --green:#1e8e5a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Noto Sans Thai", sans-serif; background:var(--bg); color:#1b2433; }
  header { background:var(--navy); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header button { background:transparent; color:#fff; border:1px solid #ffffff55; padding:6px 12px; border-radius:6px; cursor:pointer; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .login { max-width:340px; margin:80px auto; background:#fff; padding:28px; border-radius:12px; border:1px solid var(--line); }
  .login h2 { margin-top:0; color:var(--navy); }
  label { display:block; font-size:13px; color:#55607a; margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  button.primary { background:var(--navy); color:#fff; border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font:inherit; }
  button.small { padding:5px 10px; border-radius:5px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.danger { color:var(--red); }
  .err { color:var(--red); font-size:13px; margin-top:10px; min-height:18px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .stat b { display:block; font-size:28px; color:var(--navy); }
  .stat span { font-size:12px; color:#6b7690; }
  nav.tabs { display:flex; gap:6px; margin:22px 0 12px; flex-wrap:wrap; }
  nav.tabs button { background:#fff; border:1px solid var(--line); padding:8px 14px; border-radius:20px; cursor:pointer; font:inherit; }
  nav.tabs button.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:#6b7690; font-weight:600; font-size:12px; }
  .row-actions { display:flex; gap:6px; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0 14px; }
  .form-actions { margin-top:16px; display:flex; gap:8px; }
  .muted { color:#6b7690; font-size:13px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Limited Travel Card · Admin Dashboard</h1>
  <button id="logoutBtn" hidden>ออกจากระบบ</button>
</header>

<section id="loginView" class="login">
  <h2>เข้าสู่ระบบแอดมิน</h2>
  <label for="username">Username</label>
  <input id="username" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button class="primary" id="loginBtn" style="width:100%;margin-top:6px">เข้าสู่ระบบ</button>
</section>

<main id="appView" hidden>
  <div class="stats" id="stats"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="panel" id="panel"></div>
</main>

<script>
const API = '/api';
const state = { token: sessionStorage.getItem('adminToken'), tab: 'overview' };

// All dynamic content is inserted via textContent / DOM nodes, never innerHTML.
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) node.append(c instanceof Node ? c : document.createTextNode(c ?? ''));
  return node;
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.token, ...(options.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 || res.status === 403) { logout(); throw new Error(body.error || 'ไม่มีสิทธิ์'); }
  if (!res.ok) throw new Error(body.error || 'Request failed');
  return body;
}

function logout() {
  sessionStorage.removeItem('adminToken');
  state.token = null;
  showView();
}

function showView() {
  const loggedIn = !!state.token;
  document.getElementById('loginView').hidden = loggedIn;
  document.getElementById('appView').hidden = !loggedIn;
  document.getElementById('logoutBtn').hidden = !loggedIn;
  if (loggedIn) loadAll();
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const errBox = document.getElementById('loginErr');
  errBox.textContent = '';
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'เข้าสู่ระบบไม่สำเร็จ');
    if (body.user.is_admin !== 1) throw new Error('บัญชีนี้ไม่ใช่แอดมิน');
    state.token = body.token;
    sessionStorage.setItem('adminToken', body.token);
    showView();
  } catch (e) { errBox.textContent = e.message; }
});
document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
document.getElementById('logoutBtn').addEventListener('click', logout);

const TABS = [
  ['overview', 'ภาพรวม'], ['locations', 'สถานที่'], ['users', 'ผู้ใช้'], ['bookings', 'คำขอจอง'], ['checkins', 'การเช็คอิน'], ['audit', 'บันทึกการตรวจ'], ['kiosks', 'ตู้เช็คอิน'],
  ['quests', 'ภารกิจ'], ['packs', 'การ์ดสุ่ม (ของจริง)'], ['intents', 'ความต้องการการ์ดจริง'],
];

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.replaceChildren(...TABS.map(([id, label]) =>
    el('button', { class: state.tab === id ? 'active' : '', onclick: () => { state.tab = id; renderTabs(); renderPanel(); } }, label)));
}

async function loadAll() {
  renderTabs();
  try {
    const s = await api('/admin/stats');
    state.stats = s;
    const items = [['ผู้ใช้', s.users], ['สถานที่', s.locations], ['เช็คอินสำเร็จ', s.checkins], ['การ์ดที่แจก', s.cards_awarded], ['คำขอจอง', s.booking_requests], ['Kiosk สำเร็จ', s.kiosk_sessions_completed]];
    document.getElementById('stats').replaceChildren(...items.map(([label, n]) => el('div', { class: 'stat' }, el('b', {}, String(n)), el('span', {}, label))));
  } catch (e) { /* logout handled in api() */ }
  renderPanel();
}

function table(headers, rows) {
  if (!rows.length) return el('p', { class: 'muted' }, 'ยังไม่มีข้อมูล');
  return el('table', {}, el('thead', {}, el('tr', {}, headers.map((h) => el('th', {}, h)))), el('tbody', {}, rows.map((r) => el('tr', {}, r.map((c) => el('td', {}, c))))));
}
const fmtDate = (s) => (s ? String(s).replace('T', ' ').slice(0, 16) : '-');

async function renderPanel() {
  const panel = document.getElementById('panel');
  panel.replaceChildren(el('p', { class: 'muted' }, 'กำลังโหลด...'));
  try {
    if (state.tab === 'overview') {
      const s = state.stats || (await api('/admin/stats'));
      panel.replaceChildren(el('h3', {}, 'สถานที่ที่มีคนเช็คอินมากที่สุด'),
        table(['สถานที่', 'จังหวัด', 'เช็คอิน'], s.top_locations.map((l) => [l.name, l.province, String(l.checkins)])));
    } else if (state.tab === 'users') {
      const { users } = await api('/admin/users');
      panel.replaceChildren(table(['Username', 'ชื่อ', 'อีเมล', 'การ์ด', 'เช็คอิน', 'สมัครเมื่อ'],
        users.map((u) => [u.username, `${u.first_name} ${u.last_name}`, u.email, String(u.cards), String(u.checkins), fmtDate(u.created_at)])));
    } else if (state.tab === 'bookings') {
      const { requests } = await api('/admin/booking-requests');
      const statusSelect = (r) => {
        const sel = el('select', { onchange: async () => {
          try { await api('/admin/booking-requests/' + r.booking_request_id + '/status', { method: 'PUT', body: JSON.stringify({ status: sel.value }) }); }
          catch (e) { alert(e.message); renderPanel(); }
        } }, [['requested', 'รอดำเนินการ'], ['confirmed', 'ยืนยันแล้ว'], ['rejected', 'ปฏิเสธ']].map(([v, label]) => {
          const o = el('option', { value: v }, label); if (r.status === v) o.selected = true; return o;
        }));
        return sel;
      };
      panel.replaceChildren(table(['โรงแรม', 'ผู้เข้าพัก', 'ผู้ขอ', 'เข้าพัก', 'ราคา', 'สถานะ', 'เวลาขอ'],
        requests.map((r) => [r.hotel_name, r.guest_name, r.username, `${r.check_in_date} → ${r.check_out_date}`, `${Math.round(r.price_amount || 0)} ${r.price_currency || ''}`, statusSelect(r), fmtDate(r.requested_at)])));
    } else if (state.tab === 'checkins') {
      const { checkins } = await api('/admin/checkins');
      const photoBox = el('div', { style: 'margin-top:14px' });
      panel.replaceChildren(table(['เวลา', 'ผู้ใช้', 'สถานที่', 'จังหวัด', 'ยืนยันใบหน้า'],
        checkins.map((c) => [fmtDate(c.timestamp), c.username, c.location_name, c.province,
          c.photo_session_id ? el('button', { class: 'small', onclick: () => showFacePhoto(photoBox, c) }, 'ดูภาพ') : '-'])), photoBox);
    } else if (state.tab === 'audit') {
      const { audit } = await api('/admin/audit');
      const photoBox = el('div', { style: 'margin-top:14px' });
      panel.replaceChildren(table(['เวลา', 'ผู้ใช้', 'ตู้ / สถานที่', 'ความเหมือนใบหน้า', 'ผล', 'ตู้ตัดสิน (ms)', 'เหตุผล', 'ภาพ'],
        audit.map((a) => [fmtDate(a.created_at), a.username, `${a.kiosk_code} · ${a.location_name}`,
          a.face_match_score === null ? '-' : `${a.face_match_score}%`, a.passed ? 'ผ่าน' : 'ไม่ผ่าน',
          a.edge_ms === null ? '-' : String(a.edge_ms), a.reason || '-',
          a.has_photo ? el('button', { class: 'small', onclick: () => showFacePhoto(photoBox, { photo_session_id: a.session_id, username: a.username, location_name: a.location_name }) }, 'ดูภาพ') : '-'])), photoBox);
    } else if (state.tab === 'kiosks') {
      const { kiosks } = await api('/admin/kiosks');
      panel.replaceChildren(
        el('p', { class: 'muted' }, 'ใช้รหัสตู้และคีย์นี้ตั้งค่าที่เครื่อง Kiosk (ห้ามเผยแพร่คีย์) QR หน้าตู้คือ TRVKIOSK|รหัสตู้'),
        table(['รหัสตู้', 'สถานที่', 'คีย์ตู้', 'ออนไลน์ล่าสุด'],
          kiosks.map((k) => [k.kiosk_code, `${k.location_name} (${k.province})`, k.kiosk_key, k.last_seen_at ? fmtDate(k.last_seen_at) : 'ยังไม่เคย'])));
    } else if (state.tab === 'quests') {
      await renderQuests(panel);
    } else if (state.tab === 'packs') {
      await renderPacks(panel);
    } else if (state.tab === 'intents') {
      const { intents } = await api('/admin/order-intents');
      panel.replaceChildren(el('p', { class: 'muted' }, 'จำนวนผู้ที่กด "สั่งซื้อการ์ดจริง" ในแต่ละการ์ด (ใช้ประเมินความต้องการก่อนผลิตจริง)'),
        table(['การ์ด', 'ระดับ', 'ผู้สนใจ', 'ล่าสุด'], intents.map((i) => [i.name, i.rarity, String(i.interested), fmtDate(i.last_at)])));
    } else if (state.tab === 'locations') {
      await renderLocations(panel);
    }
  } catch (e) { panel.replaceChildren(el('p', { class: 'err' }, e.message)); }
}


// ---- quest review ---------------------------------------------------------------------------------------------------
const isJpegDataUrl = (u) => /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(u || '');

async function renderQuests(panel) {
  const filter = state.questFilter || 'pending';
  const { quests } = await api('/admin/quests?status=' + filter);
  const tabs = el('div', { class: 'row', style: 'gap:6px;margin-bottom:10px' }, [['pending', 'รออนุมัติ'], ['approved', 'อนุมัติแล้ว'], ['rejected', 'ไม่อนุมัติ'], ['closed', 'ปิดแล้ว']].map(([v, label]) =>
    el('button', { class: v === filter ? '' : 'small', onclick: () => { state.questFilter = v; renderPanel(); } }, label)));
  const cards = quests.map((q) => {
    const images = el('div', { class: 'muted' }, 'กำลังโหลดภาพ...');
    api('/admin/quests/' + encodeURIComponent(q.quest_id) + '/images').then((im) => {
      const parts = [];
      if (isJpegDataUrl(im.cover_image)) parts.push(el('img', { src: im.cover_image, alt: 'cover', style: 'height:150px;border-radius:8px;border:1px solid var(--line)' }));
      if (isJpegDataUrl(im.card_image)) parts.push(el('img', { src: im.card_image, alt: 'card', style: 'height:150px;border-radius:8px;border:1px solid var(--line)' }));
      images.replaceChildren(...parts);
      images.className = 'row';
      images.style.gap = '10px';
    }).catch((e) => { images.textContent = e.message; });
    const c = q.card || {};
    const period = q.permanent ? 'ภารกิจถาวร' : `${q.start_date} ถึง ${q.end_date}`;
    const actions = [];
    if (q.status === 'pending') {
      actions.push(el('button', { onclick: async () => { try { await api('/admin/quests/' + q.quest_id + '/approve', { method: 'POST', body: '{}' }); renderPanel(); } catch (e) { alert(e.message); } } }, 'อนุมัติ'));
      actions.push(el('button', { class: 'small', onclick: async () => {
        const reason = prompt('เหตุผลที่ไม่อนุมัติ (จะแจ้งกลับไปยังผู้สร้าง):');
        if (!reason) return;
        try { await api('/admin/quests/' + q.quest_id + '/reject', { method: 'POST', body: JSON.stringify({ reason }) }); renderPanel(); } catch (e) { alert(e.message); }
      } }, 'ไม่อนุมัติ'));
    } else if (q.status === 'approved') {
      actions.push(el('button', { class: 'small', onclick: async () => {
        if (!confirm('ปิดภารกิจนี้ใช่หรือไม่? ผู้ใช้จะสแกนรับการ์ดเพิ่มไม่ได้')) return;
        try { await api('/admin/quests/' + q.quest_id + '/close', { method: 'POST', body: '{}' }); renderPanel(); } catch (e) { alert(e.message); }
      } }, 'ปิดภารกิจ'));
    }
    return el('div', { class: 'panel', style: 'margin-bottom:12px' },
      el('h3', { style: 'margin:0 0 4px' }, q.title),
      el('p', { class: 'muted', style: 'margin:0 0 8px' }, `โดย @${q.creator_username} · ${q.location_name} (${q.province}) · ${period} · ส่งเมื่อ ${fmtDate(q.created_at)}`),
      el('p', { style: 'white-space:pre-wrap;margin:0 0 8px' }, q.description),
      el('p', { style: 'margin:0 0 8px' }, `การ์ด: ${c.name} · ${c.rarity} · แจกสูงสุด ${c.mint_limit} ใบ (แจกไปแล้ว ${c.minted_count}) ${c.lore ? '· ' + c.lore : ''}`),
      q.reject_reason ? el('p', { class: 'err' }, 'เหตุผลที่ไม่อนุมัติ: ' + q.reject_reason) : '',
      images, el('div', { class: 'row', style: 'gap:8px;margin-top:10px' }, actions));
  });
  panel.replaceChildren(tabs, ...(cards.length ? cards : [el('p', { class: 'muted' }, 'ไม่มีรายการ')]));
}

// ---- physical blind-pack cards -----------------------------------------------------------------------------------------
function pickJpeg(maxSide, maxChars = 700000) {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return reject(new Error('ไม่ได้เลือกไฟล์'));
      const img = new Image();
      img.onload = () => {
        let side = maxSide;
        for (let attempt = 0; attempt < 8; attempt++) {
          const scale = Math.min(1, side / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          for (const q of [0.85, 0.72, 0.6, 0.48]) {
            const url = canvas.toDataURL('image/jpeg', q);
            if (url.length <= maxChars) return resolve(url);
          }
          side = Math.round(side * 0.8);
        }
        reject(new Error('ลดขนาดภาพให้เล็กพอไม่ได้ กรุณาเลือกภาพอื่น'));
      };
      img.onerror = () => reject(new Error('อ่านไฟล์ภาพไม่ได้'));
      img.src = URL.createObjectURL(file);
    };
    input.click();
  });
}

async function renderPacks(panel) {
  const { packs } = await api('/admin/blind-packs');
  let artwork = null;
  const preview = el('div', { class: 'muted' }, 'ยังไม่ได้เลือกภาพ');
  const f = (id, label, input) => el('div', {}, el('label', { for: id }, label), input);
  const name = el('input', { id: 'bp_name', maxlength: '60' });
  const lore = el('textarea', { id: 'bp_lore', rows: '2', maxlength: '500' });
  const count = el('input', { id: 'bp_count', type: 'number', min: '1', max: '5000', value: '100' });
  const rarity = el('select', { id: 'bp_rarity' }, ['normal', 'rare', 'special'].map((r) => el('option', { value: r }, r)));
  const msg = el('p', { class: 'muted' }, '');
  const create = el('button', { onclick: async () => {
    try {
      const r = await api('/admin/blind-packs', { method: 'POST', body: JSON.stringify({ name: name.value, lore: lore.value, rarity: rarity.value, count: Number(count.value), card_image: artwork }) });
      msg.className = 'ok'; msg.textContent = `สร้างแล้ว ${r.count} ใบ`;
      renderPanel();
    } catch (e) { msg.className = 'err'; msg.textContent = e.message; }
  } }, 'สร้างชุดการ์ด');
  const form = el('div', { class: 'panel' },
    el('h3', { style: 'margin-top:0' }, 'สร้างชุดการ์ดสุ่ม (ของจริง) พร้อมรหัสเปิดใช้งาน'),
    el('p', { class: 'muted' }, 'ระบบสร้างการ์ดทุกใบเป็นสถานะ Unclaimed พร้อม QR เฉพาะใบ ดาวน์โหลดรหัสไปพิมพ์หลังการ์ดจริง'),
    f('bp_name', 'ชื่อการ์ด', name), f('bp_rarity', 'ระดับความหายาก', rarity), f('bp_count', 'จำนวนที่ผลิต', count), f('bp_lore', 'เรื่องราวการ์ด', lore),
    el('div', {}, el('label', {}, 'ภาพ Artwork'), el('button', { class: 'small', onclick: async () => {
      try {
        artwork = await pickJpeg(900);
        preview.replaceChildren(el('img', { src: artwork, alt: 'artwork', style: 'height:140px;border-radius:8px' }));
      } catch (e) { preview.textContent = e.message; }
    } }, 'เลือกภาพ'), preview),
    el('p', {}, create), msg);

  const list = table(['ชื่อ', 'ระดับ', 'ผลิต', 'เปิดใช้แล้ว', ''], packs.map((p) => [p.name, p.rarity, String(p.mint_limit), String(p.claimed),
    el('button', { class: 'small', onclick: async () => {
      try {
        const { codes } = await api('/admin/blind-packs/' + p.template_id + '/codes');
        const csv = 'serial,qr_payload,status\n' + codes.map((c) => `${c.serial},${c.payload},${c.status}`).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
        a.download = 'activation-codes-' + p.name.replace(/[^\w\u0E00-\u0E7F-]+/g, '_') + '.csv';
        a.click();
      } catch (e) { alert(e.message); }
    } }, 'ดาวน์โหลดรหัส (CSV)')]));
  panel.replaceChildren(form, el('div', { class: 'panel' }, list));
}

async function showFacePhoto(box, c) {
  box.replaceChildren(el('p', { class: 'muted' }, 'กำลังโหลดภาพ...'));
  try {
    const { photo } = await api('/admin/kiosk-sessions/' + encodeURIComponent(c.photo_session_id) + '/photo');
    if (!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(photo)) throw new Error('รูปแบบภาพไม่ถูกต้อง');
    box.replaceChildren(
      el('p', { class: 'muted' }, `ภาพที่ Kiosk ถ่าย: ${c.username} @ ${c.location_name}`),
      el('img', { src: photo, alt: 'face capture', style: 'max-width:280px;border-radius:10px;border:1px solid var(--line)' }));
  } catch (e) { box.replaceChildren(el('p', { class: 'err' }, e.message)); }
}

async function renderLocations(panel) {
  const { locations } = await api('/admin/locations');
  const rows = locations.map((l) => [
    l.name, l.province, l.mission ? l.mission.title : '-', l.card ? `${l.card.name} (${l.card.rarity})` : '-',
    l.card && l.card.has_image ? el('img', { src: '/api/media/card/' + encodeURIComponent(l.card.template_id) + '?v=' + Date.now(), alt: 'card', style: 'height:44px;border-radius:6px;border:1px solid var(--line)' }) : '-',
    el('div', { class: 'row-actions' },
      el('button', { class: 'small', onclick: () => showForm(panel, l) }, 'แก้ไข'),
      el('button', { class: 'small danger', onclick: () => removeLocation(l) }, 'ลบ')),
  ]);
  panel.replaceChildren(
    el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px' },
      el('h3', { style: 'margin:0' }, 'จัดการสถานที่'),
      el('button', { class: 'primary', onclick: () => showForm(panel, null) }, '+ เพิ่มสถานที่')),
    table(['สถานที่', 'จังหวัด', 'ภารกิจ', 'การ์ด', 'ภาพการ์ด', ''], rows));
}

async function removeLocation(l) {
  if (!confirm(`ลบ "${l.name}" ใช่หรือไม่?`)) return;
  try { await api('/admin/locations/' + l.location_id, { method: 'DELETE' }); loadAll(); }
  catch (e) { alert(e.message); }
}

function showForm(panel, existing) {
  const f = (id, label, value, type = 'text') => el('div', {}, el('label', { for: id }, label), el('input', { id, type, value: value ?? '' }));
  const e = existing || {};
  const errBox = el('div', { class: 'err' });
  const rarity = el('select', { id: 'f_rarity' }, ['normal', 'rare', 'special'].map((r) => { const o = el('option', { value: r }, r); if ((e.card && e.card.rarity) === r) o.selected = true; return o; }));
  const val = (id) => document.getElementById(id).value.trim();
  let artwork = null; // a newly picked picture (data URL); null = keep what is there
  let removeArt = false;
  const artPreview = el('div', { class: 'muted' }, 'ยังไม่มีภาพ (จะแสดงเป็นไอคอนสี)');
  const showArt = (src) => artPreview.replaceChildren(src
    ? el('img', { src, alt: 'artwork', style: 'height:180px;border-radius:10px;border:1px solid var(--line)' })
    : el('span', {}, removeArt ? 'จะลบภาพเมื่อกดบันทึก' : 'ยังไม่มีภาพ (จะแสดงเป็นไอคอนสี)'));
  if (e.card && e.card.has_image) showArt('/api/media/card/' + encodeURIComponent(e.card.template_id) + '?v=' + Date.now());
  panel.replaceChildren(
    el('h3', {}, existing ? 'แก้ไขสถานที่' : 'เพิ่มสถานที่ใหม่'),
    el('div', { class: 'form-grid' },
      f('f_name', 'ชื่อสถานที่', e.name), f('f_province', 'จังหวัด', e.province), f('f_desc', 'คำอธิบาย', e.description),
      f('f_lat', 'ละติจูด', e.latitude, 'number'), f('f_lng', 'ลองจิจูด', e.longitude, 'number'), f('f_icon', 'ไอคอน (เช่น temple_buddhist)', e.icon || 'place'),
      f('f_mtitle', 'ชื่อภารกิจ', e.mission && e.mission.title), f('f_mdesc', 'คำอธิบายภารกิจ', e.mission && e.mission.description),
      f('f_cname', 'ชื่อการ์ด', e.card && e.card.name), f('f_ccolor', 'สีการ์ด (hex)', (e.card && e.card.color_hex) || '#4C6B8A'),
      f('f_cicon', 'ไอคอนการ์ด', (e.card && e.card.icon) || 'style'),
      el('div', {}, el('label', { for: 'f_rarity' }, 'ความหายาก'), rarity),
      f('f_climit', 'จำนวนที่แจกสูงสุด (เว้นว่าง = ไม่จำกัด)', e.card && e.card.mint_limit, 'number'),
      el('div', {}, el('label', { for: 'f_clore' }, 'เรื่องราวของการ์ด (ไม่เกิน 500 ตัวอักษร)'), el('textarea', { id: 'f_clore', rows: '3', maxlength: '500' }, (e.card && e.card.lore) || ''))),
    el('div', { style: 'margin:12px 0' },
      el('label', {}, 'ภาพ Artwork การ์ด (แนวตั้ง)'),
      artPreview,
      el('div', { class: 'row', style: 'gap:8px;margin-top:6px' },
        el('button', { class: 'small', onclick: async () => {
          try {
            artwork = await pickJpeg(1100);
            removeArt = false;
            showArt(artwork);
          } catch (err) { errBox.textContent = err.message; }
        } }, 'เลือกภาพ'),
        el('button', { class: 'small danger', onclick: () => { artwork = null; removeArt = true; showArt(null); } }, 'ลบภาพ'))),
    errBox,
    el('div', { class: 'form-actions' },
      el('button', { class: 'primary', onclick: async () => {
        errBox.textContent = '';
        const payload = {
          name: val('f_name'), province: val('f_province'), description: val('f_desc'),
          latitude: parseFloat(val('f_lat')), longitude: parseFloat(val('f_lng')), icon: val('f_icon'),
          mission_title: val('f_mtitle'), mission_description: val('f_mdesc'),
          card_name: val('f_cname'), card_color_hex: val('f_ccolor'), card_icon: val('f_cicon'), card_rarity: rarity.value,
          card_mint_limit: val('f_climit'), card_lore: document.getElementById('f_clore').value.trim(),
        };
        if (artwork) payload.card_image = artwork;
        if (removeArt) payload.remove_card_image = true;
        try {
          await api(existing ? '/admin/locations/' + existing.location_id : '/admin/locations', { method: existing ? 'PUT' : 'POST', body: JSON.stringify(payload) });
          loadAll();
        } catch (err) { errBox.textContent = err.message; }
      } }, 'บันทึก'),
      el('button', { class: 'small', onclick: () => renderPanel() }, 'ยกเลิก')));
}

showView();
</script>
</body>
</html>
