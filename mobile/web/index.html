  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
  <script>
    // This app no longer uses a service worker. Remove any registered by earlier builds (they can serve a stale,
    // half-updated copy of the app and leave a white screen), then reload once.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        if (!regs.length) return;
        Promise.all(regs.map((r) => r.unregister()))
          .then(() => (window.caches ? caches.keys().then((ks) => Promise.all(ks.map((k) => caches.delete(k)))) : null))
          .then(() => location.reload());
      }).catch(() => {});
    }
  </script>
  <script>
    // Camera access for the check-in screens. One getUserMedia call per camera: the Flutter camera plugin asks once to
    // probe permission and again for every lens, and iOS Safari shows the permission prompt each time.
    window.travelCam = (function () {
      const cams = new Map();
      let nextId = 1;
      return {
        // opts: JSON {facing: 'user' | 'environment', deviceId?}. Resolves to JSON {id, label, deviceId}.
        open: async function (opts) {
          const o = opts ? JSON.parse(opts) : {};
          const facing = o.facing || 'user';
          const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
          const video = document.createElement('video');
          video.muted = true;
          video.autoplay = true;
          video.playsInline = true;
          video.setAttribute('playsinline', '');
          video.style.cssText = 'width:100%;height:100%;object-fit:cover;' + (facing === 'user' && !o.deviceId ? 'transform:scaleX(-1);' : '');
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: o.deviceId ? { deviceId: { exact: o.deviceId }, ...size } : { facingMode: { ideal: facing }, ...size },
          });
          video.srcObject = stream;
          await video.play();
          const track = stream.getVideoTracks()[0];
          const id = String(nextId++);
          cams.set(id, { video, stream, label: track.label });
          return JSON.stringify({ id, label: track.label, deviceId: (track.getSettings().deviceId) || '' });
        },
        // Shows the camera's <video> inside a platform-view container created by Flutter.
        mount: function (id, container) {
          const c = cams.get(id);
          if (!c) return;
          container.style.cssText = 'width:100%;height:100%;overflow:hidden;';
          container.appendChild(c.video);
        },
        close: function (id) {
          const c = cams.get(id);
          if (!c) return;
          c.stream.getTracks().forEach((t) => t.stop());
          c.video.remove();
          cams.delete(id);
        },
        // The current frame as a JPEG data URL ('' when the camera is gone).
        snapshot: function (id) {
          const c = cams.get(id);
          if (!c || !c.video.videoWidth) return '';
          const canvas = document.createElement('canvas');
          canvas.width = c.video.videoWidth;
          canvas.height = c.video.videoHeight;
          canvas.getContext('2d').drawImage(c.video, 0, 0);
          return canvas.toDataURL('image/jpeg', 0.85);
        },
        // Video inputs as JSON [{deviceId, label}] (labels are filled in once camera permission is granted).
        devices: async function () {
          const list = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput' && d.deviceId);
          return JSON.stringify(list.map((d) => ({ deviceId: d.deviceId, label: d.label })));
        },
        // Used by the face / QR readers below: the open camera with this track label (or the most recent one).
        video: function (label) {
          const list = [...cams.values()].filter((c) => c.stream.getVideoTracks()[0] && c.stream.getVideoTracks()[0].readyState === 'live' && c.video.videoWidth >= 64);
          if (label) {
            const match = list.find((c) => c.label === label);
            if (match) return match.video;
          }
          return list.length ? list[list.length - 1].video : null;
        },
      };
    })();
  </script>
  <script>
    // Browser-side face descriptor helper used by registration and the check-in kiosk.
    // Returns a JSON string of 128 numbers, or null when no face is found.
    window.travelFace = (function () {
      const MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
      let ready = null;
      function waitForLib() {
        return new Promise((resolve, reject) => {
          const started = Date.now();
          (function check() {
            if (window.faceapi) return resolve();
            if (Date.now() - started > 20000) return reject(new Error('face library failed to load'));
            setTimeout(check, 100);
          })();
        });
      }
      function ensureModels() {
        if (!ready) {
          ready = (async () => {
            await waitForLib();
            await faceapi.tf.setBackend('webgl').catch(() => {});
            await faceapi.tf.ready();
            await Promise.all([
              faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
              faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),
              faceapi.nets.faceRecognitionNet.loadFromUri(MODELS),
            ]);
          })().catch((e) => { ready = null; throw e; });
        }
        return ready;
      }
      // The open camera's <video>; `label` picks one camera when several are open.
      function findVideo(label) {
        return window.travelCam.video(label);
      }
      function loadImage(dataUrl) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('bad image'));
          img.src = dataUrl;
        });
      }
      let qrCanvas = null;
      return {
        preload: () => ensureModels().then(() => true).catch(() => false),
        // Decodes a QR code from the current frame of the live camera ('' when none is visible).
        readQr: function (label) {
          const video = findVideo(label || null);
          if (!video || !window.jsQR) return '';
          const scale = Math.min(1, 960 / video.videoWidth);
          const w = Math.round(video.videoWidth * scale);
          const h = Math.round(video.videoHeight * scale);
          if (!qrCanvas) qrCanvas = document.createElement('canvas');
          qrCanvas.width = w;
          qrCanvas.height = h;
          const ctx = qrCanvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, w, h);
          const code = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
          return code ? code.data : '';
        },
        // Fast per-frame check on the live camera <video> (no JPEG round trip). Returns a JSON string:
        // {problem} for no / several / tiny faces, else {yaw} (nose position across the jaw: ~0.5 facing the camera)
        // plus {descriptor} when the frame matches `mode` ('frontal' | 'turned') - the heavy recognition net runs only then.
        liveFrame: async function (mode, label) {
          await ensureModels();
          const video = findVideo(label || null);
          if (!video) return JSON.stringify({ problem: 'novideo' });
          const fast = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.6 });
          const faces = await faceapi.detectAllFaces(video, fast).withFaceLandmarks();
          if (faces.length === 0) return JSON.stringify({ problem: 'none' });
          if (faces.length > 1) return JSON.stringify({ problem: 'multiple' });
          if (faces[0].detection.box.width / video.videoWidth < 0.2) return JSON.stringify({ problem: 'small' });
          const pts = faces[0].landmarks.positions;
          const yaw = (pts[30].x - pts[0].x) / (pts[16].x - pts[0].x);
          const off = Math.abs(yaw - 0.5);
          const wanted = (mode === 'frontal' && off <= 0.11) || (mode === 'turned' && off >= 0.16);
          if (!wanted) return JSON.stringify({ yaw });
          const full = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.6 });
          const withId = await faceapi.detectAllFaces(video, full).withFaceLandmarks().withFaceDescriptors();
          if (withId.length !== 1) return JSON.stringify({ yaw });
          return JSON.stringify({ yaw, descriptor: Array.from(withId[0].descriptor) });
        },
      };
    })();

    // Current GPS position as a JSON string, or '' when unavailable or denied.
    window.travelGeo = {
      get: () => new Promise((resolve) => {
        if (!navigator.geolocation) return resolve('');
        navigator.geolocation.getCurrentPosition(
          (p) => resolve(JSON.stringify({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy })),
          () => resolve(''),
          { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 });
      }),
    };
  </script>
  <title>Limited Travel Card</title>
