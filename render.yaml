services:
  - type: web
    name: limited-travel-card-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: RAPIDAPI_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: KIOSK_SECRET
        generateValue: true
