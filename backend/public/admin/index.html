<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limited Travel Card - Admin</title>
<style>
  :root { --navy:#14284b; --gold:#d4af37; --bg:#f4f6fa; --line:#e3e7ef; --red:#c0392b; --green:#1e8e5a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Noto Sans Thai", sans-serif; background:var(--bg); color:#1b2433; }
  header { background:var(--navy); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header button { background:transparent; color:#fff; border:1px solid #ffffff55; padding:6px 12px; border-radius:6px; cursor:pointer; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .login { max-width:340px; margin:80px auto; background:#fff; padding:28px; border-radius:12px; border:1px solid var(--line); }
  .login h2 { margin-top:0; color:var(--navy); }
  label { display:block; font-size:13px; color:#55607a; margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  button.primary { background:var(--navy); color:#fff; border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font:inherit; }
  button.small { padding:5px 10px; border-radius:5px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.danger { color:var(--red); }
  .err { color:var(--red); font-size:13px; margin-top:10px; min-height:18px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .stat b { display:block; font-size:28px; color:var(--navy); }
  .stat span { font-size:12px; color:#6b7690; }
  nav.tabs { display:flex; gap:6px; margin:22px 0 12px; flex-wrap:wrap; }
  nav.tabs button { background:#fff; border:1px solid var(--line); padding:8px 14px; border-radius:20px; cursor:pointer; font:inherit; }
  nav.tabs button.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:#6b7690; font-weight:600; font-size:12px; }
  .row-actions { display:flex; gap:6px; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0 14px; }
  .form-actions { margin-top:16px; display:flex; gap:8px; }
  .muted { color:#6b7690; font-size:13px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Limited Travel Card · Admin Dashboard</h1>
  <button id="logoutBtn" hidden>ออกจากระบบ</button>
</header>

<section id="loginView" class="login">
  <h2>เข้าสู่ระบบแอดมิน</h2>
  <label for="username">Username</label>
  <input id="username" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button class="primary" id="loginBtn" style="width:100%;margin-top:6px">เข้าสู่ระบบ</button>
</section>

<main id="appView" hidden>
  <div class="stats" id="stats"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="panel" id="panel"></div>
</main>

<script>
const API = '/api';
const state = { token: sessionStorage.getItem('adminToken'), tab: 'overview' };

// All dynamic content is inserted via textContent / DOM nodes, never innerHTML.
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) node.append(c instanceof Node ? c : document.createTextNode(c ?? ''));
  return node;
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.token, ...(options.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 || res.status === 403) { logout(); throw new Error(body.error || 'ไม่มีสิทธิ์'); }
  if (!res.ok) throw new Error(body.error || 'Request failed');
  return body;
}

function logout() {
  if (state.token) fetch(API + '/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + state.token } }).catch(() => {});
  sessionStorage.removeItem('adminToken');
  state.token = null;
  showView();
}

// A warning while the admin account still has the password the system was installed with.
async function refreshBanner() {
  document.getElementById('pwBanner')?.remove();
  try {
    const { user } = await api('/auth/me');
    if (!user.using_default_password) return;
    const banner = el('div', { id: 'pwBanner', style: 'background:#fff3cd;border:1px solid #e0b100;color:#5c4400;padding:12px 16px;border-radius:10px;margin:0 0 14px' },
      el('b', {}, 'ยังใช้รหัสผ่านเริ่มต้นของแอดมิน (admin1234) '),
      'ใครเดาได้ก็เข้าดูข้อมูลผู้ใช้และรูปเช็คอินได้ ',
      el('button', { class: 'small', onclick: () => { state.tab = 'settings'; renderTabs(); renderPanel(); } }, 'เปลี่ยนรหัสผ่านตอนนี้'));
    document.querySelector('main').prepend(banner);
  } catch (e) { /* api() already handled a rejected session */ }
}

function showView() {
  const loggedIn = !!state.token;
  document.getElementById('loginView').hidden = loggedIn;
  document.getElementById('appView').hidden = !loggedIn;
  document.getElementById('logoutBtn').hidden = !loggedIn;
  if (loggedIn) loadAll();
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const errBox = document.getElementById('loginErr');
  errBox.textContent = '';
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'เข้าสู่ระบบไม่สำเร็จ');
    if (body.user.is_admin !== 1) throw new Error('บัญชีนี้ไม่ใช่แอดมิน');
    state.token = body.token;
    sessionStorage.setItem('adminToken', body.token);
    showView();
  } catch (e) { errBox.textContent = e.message; }
});
document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
document.getElementById('logoutBtn').addEventListener('click', logout);

const TABS = [
  ['overview', 'ภาพรวม'], ['locations', 'สถานที่'], ['users', 'ผู้ใช้'], ['bookings', 'คำขอจอง'], ['checkins', 'การเช็คอิน'], ['audit', 'บันทึกการตรวจ'], ['kiosks', 'ตู้เช็คอิน'],
  ['settings', 'ตั้งค่าระบบ'], ['quests', 'ภารกิจ'], ['merchants', 'ร้านค้า'], ['cards', 'การ์ด'], ['community', 'ชุมชน'], ['packs', 'การ์ดสุ่ม (ของจริง)'], ['intents', 'ความต้องการการ์ดจริง'],
];

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.replaceChildren(...TABS.map(([id, label]) =>
    el('button', { class: state.tab === id ? 'active' : '', onclick: () => { state.tab = id; renderTabs(); renderPanel(); } }, label)));
}

async function loadAll() {
  refreshBanner();
  renderTabs();
  try {
    const s = await api('/admin/stats');
    state.stats = s;
    const items = [['ผู้ใช้', s.users], ['สถานที่', s.locations], ['เช็คอินสำเร็จ', s.checkins], ['การ์ดที่แจก', s.cards_awarded], ['คำขอจอง', s.booking_requests], ['Kiosk สำเร็จ', s.kiosk_sessions_completed]];
    document.getElementById('stats').replaceChildren(...items.map(([label, n]) => el('div', { class: 'stat' }, el('b', {}, String(n)), el('span', {}, label))));
  } catch (e) { /* logout handled in api() */ }
  renderPanel();
}

function table(headers, rows) {
  if (!rows.length) return el('p', { class: 'muted' }, 'ยังไม่มีข้อมูล');
  return el('table', {}, el('thead', {}, el('tr', {}, headers.map((h) => el('th', {}, h)))), el('tbody', {}, rows.map((r) => el('tr', {}, r.map((c) => el('td', {}, c))))));
}
const fmtDate = (s) => (s ? String(s).replace('T', ' ').slice(0, 16) : '-');

async function renderPanel() {
  const panel = document.getElementById('panel');
  panel.replaceChildren(el('p', { class: 'muted' }, 'กำลังโหลด...'));
  try {
    if (state.tab === 'overview') {
      const s = state.stats || (await api('/admin/stats'));
      const backup = await api('/admin/backup-status').catch(() => null);
      const backupLine = !backup ? '' : !backup.enabled ? 'การสำรองข้อมูลปิดอยู่' : backup.blocked
        ? 'สำรองข้อมูลไม่ทำงาน: กู้ข้อมูลไม่สำเร็จตอนเริ่มระบบ (ระบบไม่อัปโหลดทับของเดิม)'
        : `สำรองข้อมูลล่าสุด: ${backup.lastSuccessAt ? fmtDate(backup.lastSuccessAt) + ` (${backup.lastSizeKb} KB)` : 'ยังไม่เคยสำเร็จหลังเริ่มระบบ'}${backup.pending_changes ? ' · มีการเปลี่ยนแปลงรอสำรอง' : ''}${backup.lastError ? ' · ครั้งล่าสุดที่ผิดพลาด: ' + backup.lastError : ''}`;
      panel.replaceChildren(backupLine ? el('p', { class: backup && backup.lastError && !backup.lastSuccessAt ? 'err' : 'muted' }, backupLine) : '',
        el('h3', {}, 'สถานที่ที่มีคนเช็คอินมากที่สุด'),
        table(['สถานที่', 'จังหวัด', 'เช็คอิน'], s.top_locations.map((l) => [l.name, l.province, String(l.checkins)])));
    } else if (state.tab === 'users') {
      const { users } = await api('/admin/users');
      panel.replaceChildren(table(['Username', 'ชื่อ', 'อีเมล', 'การ์ด', 'เช็คอิน', 'สมัครเมื่อ'],
        users.map((u) => [u.username, `${u.first_name} ${u.last_name}`, u.email, String(u.cards), String(u.checkins), fmtDate(u.created_at)])));
    } else if (state.tab === 'bookings') {
      const { requests } = await api('/admin/booking-requests');
      const statusSelect = (r) => {
        const sel = el('select', { onchange: async () => {
          try { await api('/admin/booking-requests/' + r.booking_request_id + '/status', { method: 'PUT', body: JSON.stringify({ status: sel.value }) }); }
          catch (e) { alert(e.message); renderPanel(); }
        } }, [['requested', 'รอดำเนินการ'], ['confirmed', 'ยืนยันแล้ว'], ['rejected', 'ปฏิเสธ']].map(([v, label]) => {
          const o = el('option', { value: v }, label); if (r.status === v) o.selected = true; return o;
        }));
        return sel;
      };
      panel.replaceChildren(table(['โรงแรม', 'ผู้เข้าพัก', 'ผู้ขอ', 'เข้าพัก', 'ราคา', 'สถานะ', 'เวลาขอ'],
        requests.map((r) => [r.hotel_name, r.guest_name, r.username, `${r.check_in_date} → ${r.check_out_date}`, `${Math.round(r.price_amount || 0)} ${r.price_currency || ''}`, statusSelect(r), fmtDate(r.requested_at)])));
    } else if (state.tab === 'checkins') {
      const { checkins } = await api('/admin/checkins');
      const photoBox = el('div', { style: 'margin-top:14px' });
      panel.replaceChildren(table(['เวลา', 'ผู้ใช้', 'สถานที่', 'จังหวัด', 'ยืนยันใบหน้า'],
        checkins.map((c) => [fmtDate(c.timestamp), c.username, c.location_name, c.province,
          c.photo_session_id ? el('button', { class: 'small', onclick: () => showFacePhoto(photoBox, c) }, 'ดูภาพ') : '-'])), photoBox);
    } else if (state.tab === 'audit') {
      const { audit } = await api('/admin/audit');
      const photoBox = el('div', { style: 'margin-top:14px' });
      panel.replaceChildren(table(['เวลา', 'ผู้ใช้', 'ตู้ / สถานที่', 'ความเหมือนใบหน้า', 'ผล', 'ตู้ตัดสิน (ms)', 'เหตุผล', 'ภาพ'],
        audit.map((a) => [fmtDate(a.created_at), a.username, `${a.kiosk_code} · ${a.location_name}`,
          a.face_match_score === null ? '-' : `${a.face_match_score}%`, a.passed ? 'ผ่าน' : 'ไม่ผ่าน',
          a.edge_ms === null ? '-' : String(a.edge_ms), a.reason || '-',
          a.has_photo ? el('button', { class: 'small', onclick: () => showFacePhoto(photoBox, { photo_session_id: a.session_id, username: a.username, location_name: a.location_name }) }, 'ดูภาพ') : '-'])), photoBox);
    } else if (state.tab === 'kiosks') {
      const { kiosks } = await api('/admin/kiosks');
      panel.replaceChildren(
        el('p', { class: 'muted' }, 'ใช้รหัสตู้และคีย์นี้ตั้งค่าที่เครื่อง Kiosk (ห้ามเผยแพร่คีย์) QR หน้าตู้คือ TRVKIOSK|รหัสตู้'),
        table(['รหัสตู้', 'สถานที่', 'คีย์ตู้', 'ออนไลน์ล่าสุด', 'สถานะ', ''],
          kiosks.map((k) => [k.kiosk_code, `${k.location_name} (${k.province})`, k.kiosk_key, k.last_seen_at ? fmtDate(k.last_seen_at) : 'ยังไม่เคย', k.disabled ? 'ปิดใช้งาน' : 'ใช้งาน',
            el('div', { class: 'row-actions' },
              el('button', { class: 'small', onclick: async () => {
                if (!confirm(`ออกคีย์ใหม่ให้ ${k.kiosk_code}? คีย์เดิมจะใช้ไม่ได้ทันที และต้องตั้งค่าเครื่องตู้ใหม่ด้วยคีย์ใหม่`)) return;
                try { const r = await api('/admin/kiosks/' + k.kiosk_code + '/rotate-key', { method: 'POST', body: '{}' }); alert('คีย์ใหม่ของ ' + k.kiosk_code + ': ' + r.kiosk_key); renderPanel(); } catch (e) { alert(e.message); }
              } }, 'ออกคีย์ใหม่'),
              el('button', { class: 'small' + (k.disabled ? '' : ' danger'), onclick: async () => {
                if (!k.disabled && !confirm(`ปิดการใช้งาน ${k.kiosk_code}? ตู้จะเข้าระบบไม่ได้และนักท่องเที่ยวเช็คอินที่ตู้นี้ไม่ได้`)) return;
                try { await api('/admin/kiosks/' + k.kiosk_code + (k.disabled ? '/enable' : '/disable'), { method: 'POST', body: '{}' }); renderPanel(); } catch (e) { alert(e.message); }
              } }, k.disabled ? 'เปิดใช้งาน' : 'ปิดใช้งาน'))])));
    } else if (state.tab === 'cards') {
      await renderCards(panel);
    } else if (state.tab === 'community') {
      await renderCommunity(panel);
    } else if (state.tab === 'settings') {
      await renderSettings(panel);
    } else if (state.tab === 'quests') {
      await renderQuests(panel);
    } else if (state.tab === 'merchants') {
      await renderMerchants(panel);
    } else if (state.tab === 'packs') {
      await renderPacks(panel);
    } else if (state.tab === 'intents') {
      const { intents } = await api('/admin/order-intents');
      panel.replaceChildren(el('p', { class: 'muted' }, 'จำนวนผู้ที่กด "สั่งซื้อการ์ดจริง" ในแต่ละการ์ด (ใช้ประเมินความต้องการก่อนผลิตจริง)'),
        table(['การ์ด', 'ระดับ', 'ผู้สนใจ', 'ยังไม่ได้แจ้ง', 'ล่าสุด', ''], intents.map((i) => [i.name, i.rarity, String(i.interested), String(i.unnotified || 0), fmtDate(i.last_at),
          el('button', { class: 'small', disabled: !i.unnotified, onclick: async () => {
            if (!confirm(`แจ้งผู้สนใจ ${i.unnotified} คนว่าการ์ด "${i.name}" พร้อมจัดส่งแล้ว? (แต่ละคนได้รับแจ้งครั้งเดียว)`)) return;
            try { const r = await api('/admin/order-intents/' + i.template_id + '/notify', { method: 'POST', body: '{}' }); alert('แจ้งแล้ว ' + r.notified + ' คน'); renderPanel(); } catch (e) { alert(e.message); }
          } }, 'แจ้งว่าพร้อมแล้ว')])));
    } else if (state.tab === 'locations') {
      await renderLocations(panel);
    }
  } catch (e) { panel.replaceChildren(el('p', { class: 'err' }, e.message)); }
}




// ---- printable QR sheet for physical cards ----------------------------------------------------------------------------------
async function loadQrLibrary() {
  if (window.qrcode) return;
  await new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    sc.onload = resolve;
    sc.onerror = () => reject(new Error('โหลดตัวสร้าง QR ไม่ได้ (ต้องเชื่อมต่ออินเทอร์เน็ต)'));
    document.head.appendChild(sc);
  });
}

// One QR per card, 4 across, with its serial number underneath. The codes never leave this browser tab.
async function printQrSheet(pack) {
  const { codes, name } = await api('/admin/blind-packs/' + pack.template_id + '/codes');
  await loadQrLibrary();
  const w = window.open('', '_blank');
  if (!w) throw new Error('เบราว์เซอร์บล็อกหน้าต่างใหม่ กรุณาอนุญาตป๊อปอัปแล้วลองอีกครั้ง');
  const d = w.document;
  d.title = 'QR ' + name;
  const style = d.createElement('style');
  style.textContent = '@page{size:A4;margin:10mm}body{font-family:sans-serif;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}'
    + '.cell{border:1px dashed #bbb;padding:3mm;text-align:center;break-inside:avoid}.cell svg{width:34mm;height:34mm}.cell b{display:block;font-size:11pt}.cell small{color:#555;font-size:8pt}'
    + 'h1{font-size:12pt;margin:0 0 4mm}@media print{h1{display:none}}';
  d.head.appendChild(style);
  const title = d.createElement('h1');
  title.textContent = `${name}: ${codes.length} ใบ (กด Ctrl+P เพื่อพิมพ์)`;
  const grid = d.createElement('div');
  grid.className = 'grid';
  for (const c of codes) {
    const qr = window.qrcode(0, 'M');
    qr.addData(c.payload);
    qr.make();
    const cell = d.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); // output of the QR library for a code made of hex digits
    const serial = d.createElement('b');
    serial.textContent = c.serial;
    const small = d.createElement('small');
    small.textContent = name;
    cell.append(serial, small);
    grid.appendChild(cell);
  }
  d.body.append(title, grid);
  setTimeout(() => w.print(), 400);
}

// ---- cards: search and void -------------------------------------------------------------------------------------------------
async function renderCards(panel) {
  const q = state.cardQuery || '';
  const { cards } = await api('/admin/cards' + (q ? '?q=' + encodeURIComponent(q) : ''));
  const input = el('input', { value: q, placeholder: 'ค้นหาจาก Username เจ้าของ หรือชื่อการ์ด', style: 'max-width:340px', onkeydown: (e) => { if (e.key === 'Enter') { state.cardQuery = input.value.trim(); renderPanel(); } } });
  const rows = cards.map((c) => [
    c.serial_label || '-', c.name, c.rarity, c.card_type === 'PHYSICAL_BLIND_PACK' ? 'การ์ดสุ่ม' : 'ภารกิจ/สถานที่', c.activation_status, c.owner_username || '-',
    c.activation_status === 'VOIDED' ? '-' : el('button', { class: 'small danger', onclick: async () => {
      const reason = prompt(`ยกเลิกการ์ด "${c.name}" ${c.serial_label || ''} ของ ${c.owner_username || '(ยังไม่มีเจ้าของ)'}?\nใส่เหตุผล (ผู้ถือครองจะได้รับแจ้ง):`);
      if (reason === null) return;
      try { await api('/admin/cards/' + c.card_instance_id + '/void', { method: 'POST', body: JSON.stringify({ reason }) }); renderPanel(); } catch (e) { alert(e.message); }
    } }, 'ยกเลิกการ์ด')]);
  panel.replaceChildren(
    el('div', { class: 'row', style: 'gap:8px;margin-bottom:10px' }, input, el('button', { class: 'small', onclick: () => { state.cardQuery = input.value.trim(); renderPanel(); } }, 'ค้นหา')),
    el('p', { class: 'muted' }, 'แสดงสูงสุด 100 ใบล่าสุด การยกเลิกจะนำการ์ดออกจากคลัง ตู้โชว์ และข้อเสนอแลกเปลี่ยนทันที (ยังนับเป็นจำนวนที่ผลิตแล้ว)'),
    table(['หมายเลข', 'การ์ด', 'ระดับ', 'ประเภท', 'สถานะ', 'เจ้าของ', ''], rows));
}

// ---- community moderation ---------------------------------------------------------------------------------------------------
async function renderCommunity(panel) {
  const reportedOnly = !!state.communityReported;
  const { posts } = await api('/admin/community/posts' + (reportedOnly ? '?reported=1' : ''));
  const toggle = el('div', { class: 'row', style: 'gap:6px;margin-bottom:10px' }, [[false, 'โพสต์ล่าสุด'], [true, 'ถูกรายงาน']].map(([v, label]) =>
    el('button', { class: v === reportedOnly ? '' : 'small', onclick: () => { state.communityReported = v; renderPanel(); } }, label)));
  const rows = posts.map((p) => {
    const detail = el('div', { class: 'muted', style: 'font-size:12px' });
    const showMore = async () => {
      try {
        const parts = [];
        if (p.reports > 0) {
          const { reports } = await api('/admin/community/posts/' + p.post_id + '/reports');
          parts.push(el('div', {}, [el('b', {}, 'เหตุผลที่ถูกรายงาน: '), reports.map((r) => `${r.reason} (โดย @${r.reporter})`).join(' · ')]));
        }
        if (p.images > 0) {
          const { images } = await api('/admin/community/posts/' + p.post_id + '/images');
          parts.push(el('div', { class: 'row', style: 'gap:6px;flex-wrap:wrap;margin-top:4px' }, images.filter(isJpegDataUrl).map((u) => el('img', { src: u, alt: '', style: 'height:80px;border-radius:6px;border:1px solid var(--line)' }))));
        }
        detail.replaceChildren(...(parts.length ? parts : [document.createTextNode('ไม่มีรายละเอียดเพิ่มเติม')]));
      } catch (e) { detail.textContent = e.message; }
    };
    const text = p.content.length > 140 ? p.content.slice(0, 140) + '…' : p.content;
    return [
      fmtDate(p.timestamp), p.username,
      el('div', {}, el('div', {}, text || '(รูปภาพ)'), p.location_name ? el('div', { class: 'muted', style: 'font-size:12px' }, '📍 ' + p.location_name) : '',
        (p.reports > 0 || p.images > 0) ? el('button', { class: 'small', onclick: showMore }, 'ดูรูป/เหตุผลรายงาน') : '', detail),
      `${p.likes} / ${p.comments} / ${p.images}`, p.reports > 0 ? el('b', { class: 'err' }, String(p.reports)) : '0', p.status === 'visible' ? 'แสดง' : 'ซ่อน',
      el('button', { class: 'small' + (p.status === 'visible' ? ' danger' : ''), onclick: async () => {
        try { await api('/admin/community/posts/' + p.post_id, { method: 'PUT', body: JSON.stringify({ status: p.status === 'visible' ? 'hidden' : 'visible' }) }); renderPanel(); } catch (e) { alert(e.message); }
      } }, p.status === 'visible' ? 'ซ่อน' : 'แสดงอีกครั้ง')];
  });
  panel.replaceChildren(
    el('p', { class: 'muted' }, 'โพสต์ที่ซ่อนจะไม่แสดงในแอป รูปของโพสต์จะเปิดดูไม่ได้ และไม่นับเข้าอันดับนักเที่ยวประจำเดือน (ซ่อนแล้วคืนสถานะได้)'),
    toggle,
    table(['เวลา', 'ผู้โพสต์', 'เนื้อหา', 'รีแอคชัน / คอมเมนต์ / รูป', 'ถูกรายงาน', 'สถานะ', ''], rows));
}

  const nw2 = el('input', { type: 'password', id: 'pw_new2', autocomplete: 'new-password' });
  const pwForm = el('div', { class: 'panel' },
    el('h3', { style: 'margin-top:0' }, 'เปลี่ยนรหัสผ่านของฉัน'),
    el('div', { class: 'form-grid' },
      el('div', {}, el('label', { for: 'pw_cur' }, 'รหัสผ่านปัจจุบัน'), cur),
      el('div', {}, el('label', { for: 'pw_new' }, 'รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)'), nw),
      el('div', {}, el('label', { for: 'pw_new2' }, 'ยืนยันรหัสผ่านใหม่'), nw2)),
    el('p', {}, el('button', { class: 'primary', onclick: async () => {
      pwMsg.className = 'err';
      if (nw.value !== nw2.value) { pwMsg.textContent = 'รหัสผ่านใหม่สองช่องไม่ตรงกัน'; return; }
      try {
        await api('/auth/change-password', { method: 'POST', body: JSON.stringify({ current_password: cur.value, new_password: nw.value }) });

        pwMsg.textContent = 'เปลี่ยนรหัสผ่านแล้ว (อุปกรณ์อื่นที่ล็อกอินอยู่จะถูกออกจากระบบ)';

      } catch (e) { pwMsg.textContent = e.message; }
    } }, 'เปลี่ยนรหัสผ่าน')), pwMsg);

  const inputs = {};

    inputs[x.key] = input;

  });
  const setMsg = el('p', { class: 'muted' }, '');
  const settingsPanel = el('div', { class: 'panel' },

    table(['รายการ', 'ค่า', 'ค่าเริ่มต้น'], rows),

      const changes = {};
      for (const x of settings) changes[x.key] = x.type === 'bool' ? inputs[x.key].checked : Number(inputs[x.key].value);

        await api('/admin/settings', { method: 'PUT', body: JSON.stringify(changes) });
        setMsg.className = 'ok';
        setMsg.textContent = 'บันทึกแล้ว';
      } catch (e) { setMsg.className = 'err'; setMsg.textContent = e.message; }
    } }, 'บันทึกการตั้งค่า')), setMsg);

  const backupPanel = el('div', { class: 'panel' },
    el('h3', { style: 'margin-top:0' }, 'สถานะการสำรองข้อมูล'),

// ---- quest review ---------------------------------------------------------------------------------------------------
const isJpegDataUrl = (u) => /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(u || '');

async function renderQuests(panel) {
  const filter = state.questFilter || 'pending';
  const { quests } = await api('/admin/quests?status=' + filter);
  const tabs = el('div', { class: 'row', style: 'gap:6px;margin-bottom:10px' }, [['pending', 'รออนุมัติ'], ['approved', 'อนุมัติแล้ว'], ['rejected', 'ไม่อนุมัติ'], ['closed', 'ปิดแล้ว']].map(([v, label]) =>
    el('button', { class: v === filter ? '' : 'small', onclick: () => { state.questFilter = v; renderPanel(); } }, label)));
  const cards = quests.map((q) => {
    const images = el('div', { class: 'muted' }, 'กำลังโหลดภาพ...');
    api('/admin/quests/' + encodeURIComponent(q.quest_id) + '/images').then((im) => {
      const parts = [];
      if (isJpegDataUrl(im.cover_image)) parts.push(el('img', { src: im.cover_image, alt: 'cover', style: 'height:150px;border-radius:8px;border:1px solid var(--line)' }));
      if (isJpegDataUrl(im.card_image)) parts.push(el('img', { src: im.card_image, alt: 'card', style: 'height:150px;border-radius:8px;border:1px solid var(--line)' }));
      images.replaceChildren(...parts);
      images.className = 'row';
      images.style.gap = '10px';
    }).catch((e) => { images.textContent = e.message; });
    const c = q.card || {};
    const period = q.permanent ? 'ภารกิจถาวร' : `${q.start_date} ถึง ${q.end_date}`;
    const actions = [];
    if (q.status === 'pending') {
      actions.push(el('button', { onclick: async () => { try { await api('/admin/quests/' + q.quest_id + '/approve', { method: 'POST', body: '{}' }); renderPanel(); } catch (e) { alert(e.message); } } }, 'อนุมัติ'));
      actions.push(el('button', { class: 'small', onclick: async () => {
        const reason = prompt('เหตุผลที่ไม่อนุมัติ (จะแจ้งกลับไปยังผู้สร้าง):');
        if (!reason) return;
        try { await api('/admin/quests/' + q.quest_id + '/reject', { method: 'POST', body: JSON.stringify({ reason }) }); renderPanel(); } catch (e) { alert(e.message); }
      } }, 'ไม่อนุมัติ'));
    } else if (q.status === 'approved') {
      actions.push(el('button', { class: 'small', onclick: async () => {
        if (!confirm('ปิดภารกิจนี้ใช่หรือไม่? ผู้ใช้จะสแกนรับการ์ดเพิ่มไม่ได้')) return;
        try { await api('/admin/quests/' + q.quest_id + '/close', { method: 'POST', body: '{}' }); renderPanel(); } catch (e) { alert(e.message); }
      } }, 'ปิดภารกิจ'));
    }
    return el('div', { class: 'panel', style: 'margin-bottom:12px' },
      el('h3', { style: 'margin:0 0 4px' }, q.title),
      el('p', { class: 'muted', style: 'margin:0 0 8px' }, `โดย @${q.creator_username} · ${q.location_name} (${q.province}) · ${period} · ส่งเมื่อ ${fmtDate(q.created_at)}`),
      el('p', { style: 'white-space:pre-wrap;margin:0 0 8px' }, q.description),
      el('p', { style: 'margin:0 0 8px' }, `การ์ด: ${c.name} · ${c.rarity} · แจกสูงสุด ${c.mint_limit} ใบ (แจกไปแล้ว ${c.minted_count}) ${c.lore ? '· ' + c.lore : ''}`),
      q.reject_reason ? el('p', { class: 'err' }, 'เหตุผลที่ไม่อนุมัติ: ' + q.reject_reason) : '',
      images, el('div', { class: 'row', style: 'gap:8px;margin-top:10px' }, actions));
  });
  panel.replaceChildren(tabs, ...(cards.length ? cards : [el('p', { class: 'muted' }, 'ไม่มีรายการ')]));
}

        el('p', { class: 'muted', style: 'margin:0 0 6px' }, 'ติดต่อ: ' + contact),
        el('div', { class: 'row', style: 'gap:8px;flex-wrap:wrap;margin-bottom:8px' }, [img(f.cover_image, 140), ...f.gallery.map((g) => img(g.image, 90))]),
        f.items.length ? el('div', { style: 'margin-bottom:8px' }, [el('b', {}, 'เมนู/สินค้า'), el('div', { class: 'row', style: 'gap:10px;flex-wrap:wrap' }, f.items.map((i) =>
          el('div', { style: 'width:110px;font-size:12px' }, img(i.image, 70), el('div', {}, (i.is_signature ? '★ ' : '') + i.name), el('div', { class: 'muted' }, i.price + ' บาท'))))]) : '',
        f.privileges.length ? el('div', {}, [el('b', {}, 'สิทธิประโยชน์การ์ด'), ...f.privileges.map((p) =>
          el('p', { style: 'margin:2px 0' }, `การ์ด ${p.template_name || p.template_id}: ${p.description} (${p.start_date || 'ไม่จำกัด'} ถึง ${p.end_date || 'ไม่จำกัด'})`))]) : '');
    }).catch((e) => { body.textContent = e.message; });
    const act = (path, payload) => async () => {
      try { await api('/admin/merchants/' + m.merchant_id + path, { method: 'POST', body: JSON.stringify(payload || {}) }); renderPanel(); } catch (e) { alert(e.message); }
    };
    const withReason = (path, ask) => async () => {
      const reason = prompt(ask);
      if (!reason) return;
      await act(path, { reason })();
    };
    const buttons = [];
    if (m.approval_status === 'PENDING' || m.has_revision) {
      buttons.push(el('button', { onclick: act('/approve') }, m.has_revision ? 'อนุมัติการแก้ไข' : 'อนุมัติ'));
      buttons.push(el('button', { class: 'small', onclick: withReason('/reject', 'เหตุผลที่ไม่อนุมัติ (จะแจ้งกลับไปยังเจ้าของร้าน):') }, 'ไม่อนุมัติ'));
    }
    if (m.approval_status === 'APPROVED') buttons.push(el('button', { class: 'small', onclick: withReason('/suspend', 'เหตุผลที่ระงับร้าน:') }, 'ระงับร้าน'));
    if (m.approval_status === 'SUSPENDED') buttons.push(el('button', { onclick: act('/unsuspend') }, 'ยกเลิกการระงับ'));
    return el('div', { class: 'panel', style: 'margin-bottom:12px' },
      el('h3', { style: 'margin:0 0 4px' }, `${m.shop_name_th} / ${m.shop_name_en}`),
      el('p', { class: 'muted', style: 'margin:0 0 8px' },
        `${CATEGORY_TH[m.category] || m.category} · โดย @${m.owner_username} · สถานะ ${SHOP_STATUS_TH[m.approval_status]}${m.has_revision ? ' (มีคำขอแก้ไขรออนุมัติ — แสดงเนื้อหาที่ขอแก้)' : ''} · อัปเดต ${fmtDate(m.updated_at)}`),

      body, el('div', { class: 'row', style: 'gap:8px;margin-top:10px' }, buttons));
  });
  panel.replaceChildren(tabs, ...(cards.length ? cards : [el('p', { class: 'muted' }, 'ไม่มีรายการ')]));
}

// ---- physical blind-pack cards -----------------------------------------------------------------------------------------
function pickJpeg(maxSide, maxChars = 700000) {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return reject(new Error('ไม่ได้เลือกไฟล์'));
      const img = new Image();
      img.onload = () => {
        let side = maxSide;
        for (let attempt = 0; attempt < 8; attempt++) {
          const scale = Math.min(1, side / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          for (const q of [0.85, 0.72, 0.6, 0.48]) {
            const url = canvas.toDataURL('image/jpeg', q);
            if (url.length <= maxChars) return resolve(url);
          }
          side = Math.round(side * 0.8);
        }
        reject(new Error('ลดขนาดภาพให้เล็กพอไม่ได้ กรุณาเลือกภาพอื่น'));
      };
      img.onerror = () => reject(new Error('อ่านไฟล์ภาพไม่ได้'));
      img.src = URL.createObjectURL(file);
    };
    input.click();
  });
}

      try { await printQrSheet(p); } catch (e) { alert(e.message); }
    } }, 'พิมพ์แผ่น QR')]));
  panel.replaceChildren(form, el('div', { class: 'panel' }, list));
}

async function showFacePhoto(box, c) {
  box.replaceChildren(el('p', { class: 'muted' }, 'กำลังโหลดภาพ...'));
  try {
    const { photo } = await api('/admin/kiosk-sessions/' + encodeURIComponent(c.photo_session_id) + '/photo');
    if (!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(photo)) throw new Error('รูปแบบภาพไม่ถูกต้อง');
    box.replaceChildren(
      el('p', { class: 'muted' }, `ภาพที่ Kiosk ถ่าย: ${c.username} @ ${c.location_name}`),
      el('img', { src: photo, alt: 'face capture', style: 'max-width:280px;border-radius:10px;border:1px solid var(--line)' }));
  } catch (e) { box.replaceChildren(el('p', { class: 'err' }, e.message)); }
}

async function renderLocations(panel) {
  const { locations } = await api('/admin/locations');
  const rows = locations.map((l) => [
    l.name, l.province, l.mission ? l.mission.title : '-', l.card ? `${l.card.name} (${l.card.rarity})` : '-',
    l.card && l.card.has_image ? el('img', { src: '/api/media/card/' + encodeURIComponent(l.card.template_id) + '?v=' + Date.now(), alt: 'card', style: 'height:44px;border-radius:6px;border:1px solid var(--line)' }) : '-',
    el('div', { class: 'row-actions' },
      el('button', { class: 'small', onclick: () => showForm(panel, l) }, 'แก้ไข'),
      el('button', { class: 'small danger', onclick: () => removeLocation(l) }, 'ลบ')),
  ]);
  panel.replaceChildren(
    el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px' },
      el('h3', { style: 'margin:0' }, 'จัดการสถานที่'),
      el('button', { class: 'primary', onclick: () => showForm(panel, null) }, '+ เพิ่มสถานที่')),
    table(['สถานที่', 'จังหวัด', 'ภารกิจ', 'การ์ด', 'ภาพการ์ด', ''], rows));
}

async function removeLocation(l) {
  if (!confirm(`ลบ "${l.name}" ใช่หรือไม่?`)) return;
  try { await api('/admin/locations/' + l.location_id, { method: 'DELETE' }); loadAll(); }
  catch (e) { alert(e.message); }
}

function showForm(panel, existing) {
  const f = (id, label, value, type = 'text') => el('div', {}, el('label', { for: id }, label), el('input', { id, type, value: value ?? '' }));
  const e = existing || {};
  const errBox = el('div', { class: 'err' });
  const rarity = el('select', { id: 'f_rarity' }, ['normal', 'rare', 'special'].map((r) => { const o = el('option', { value: r }, r); if ((e.card && e.card.rarity) === r) o.selected = true; return o; }));
  const val = (id) => document.getElementById(id).value.trim();
  let artwork = null; // a newly picked picture (data URL); null = keep what is there
  let removeArt = false;
  const artPreview = el('div', { class: 'muted' }, 'ยังไม่มีภาพ (จะแสดงเป็นไอคอนสี)');
  const showArt = (src) => artPreview.replaceChildren(src
    ? el('img', { src, alt: 'artwork', style: 'height:180px;border-radius:10px;border:1px solid var(--line)' })
    : el('span', {}, removeArt ? 'จะลบภาพเมื่อกดบันทึก' : 'ยังไม่มีภาพ (จะแสดงเป็นไอคอนสี)'));
  if (e.card && e.card.has_image) showArt('/api/media/card/' + encodeURIComponent(e.card.template_id) + '?v=' + Date.now());
  panel.replaceChildren(
    el('h3', {}, existing ? 'แก้ไขสถานที่' : 'เพิ่มสถานที่ใหม่'),
    el('div', { class: 'form-grid' },
      f('f_name', 'ชื่อสถานที่', e.name), f('f_province', 'จังหวัด', e.province), f('f_desc', 'คำอธิบาย', e.description),
      f('f_lat', 'ละติจูด', e.latitude, 'number'), f('f_lng', 'ลองจิจูด', e.longitude, 'number'), f('f_icon', 'ไอคอน (เช่น temple_buddhist)', e.icon || 'place'),
      f('f_mtitle', 'ชื่อภารกิจ', e.mission && e.mission.title), f('f_mdesc', 'คำอธิบายภารกิจ', e.mission && e.mission.description),
      f('f_cname', 'ชื่อการ์ด', e.card && e.card.name), f('f_ccolor', 'สีการ์ด (hex)', (e.card && e.card.color_hex) || '#4C6B8A'),
      f('f_cicon', 'ไอคอนการ์ด', (e.card && e.card.icon) || 'style'),
      el('div', {}, el('label', { for: 'f_rarity' }, 'ความหายาก'), rarity),
      f('f_climit', 'จำนวนที่แจกสูงสุด (เว้นว่าง = ไม่จำกัด)', e.card && e.card.mint_limit, 'number'),
      el('div', {}, el('label', { for: 'f_clore' }, 'เรื่องราวของการ์ด (ไม่เกิน 500 ตัวอักษร)'), el('textarea', { id: 'f_clore', rows: '3', maxlength: '500' }, (e.card && e.card.lore) || ''))),
    el('div', { style: 'margin:12px 0' },
      el('label', {}, 'ภาพ Artwork การ์ด (แนวตั้ง)'),
      artPreview,
      el('div', { class: 'row', style: 'gap:8px;margin-top:6px' },
        el('button', { class: 'small', onclick: async () => {
          try {
            artwork = await pickJpeg(1100);
            removeArt = false;
            showArt(artwork);
          } catch (err) { errBox.textContent = err.message; }
        } }, 'เลือกภาพ'),
        el('button', { class: 'small danger', onclick: () => { artwork = null; removeArt = true; showArt(null); } }, 'ลบภาพ'))),
    errBox,
    el('div', { class: 'form-actions' },
      el('button', { class: 'primary', onclick: async () => {
        errBox.textContent = '';
        const payload = {
          name: val('f_name'), province: val('f_province'), description: val('f_desc'),
          latitude: parseFloat(val('f_lat')), longitude: parseFloat(val('f_lng')), icon: val('f_icon'),
          mission_title: val('f_mtitle'), mission_description: val('f_mdesc'),
          card_name: val('f_cname'), card_color_hex: val('f_ccolor'), card_icon: val('f_cicon'), card_rarity: rarity.value,
          card_mint_limit: val('f_climit'), card_lore: document.getElementById('f_clore').value.trim(),
        };
        if (artwork) payload.card_image = artwork;
        if (removeArt) payload.remove_card_image = true;
        try {
          await api(existing ? '/admin/locations/' + existing.location_id : '/admin/locations', { method: existing ? 'PUT' : 'POST', body: JSON.stringify(payload) });
          loadAll();
        } catch (err) { errBox.textContent = err.message; }
      } }, 'บันทึก'),
      el('button', { class: 'small', onclick: () => renderPanel() }, 'ยกเลิก')));
}

showView();
</script>
</body>
</html>
